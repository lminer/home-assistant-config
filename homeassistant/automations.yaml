- id: master_bedroom_pico
  alias: Master Bedroom Pico
  description: >-
    4-button Pico (PJ2-4B-GXX-X01, serial 156170791) driving the master suite:
    On = everything full, Raise = everything low, Lower = reading lamps only,
    Off = everything off.
  mode: queued
  max: 4
  triggers:
    - trigger: event
      event_type: lutron_caseta_button_event
      event_data:
        serial: 156170791
        button_type: "on"
        action: press
      id: all_on
    - trigger: event
      event_type: lutron_caseta_button_event
      event_data:
        serial: 156170791
        button_type: raise
        action: press
      id: all_low
    - trigger: event
      event_type: lutron_caseta_button_event
      event_data:
        serial: 156170791
        button_type: lower
        action: press
      id: reading
    - trigger: event
      event_type: lutron_caseta_button_event
      event_data:
        serial: 156170791
        button_type: "off"
        action: press
      id: all_off
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: all_on
          sequence:
            - action: scene.turn_on
              target:
                entity_id: scene.master_suite_all_on
              data:
                transition: 1

        - conditions:
            - condition: trigger
              id: all_low
          sequence:
            - action: scene.turn_on
              target:
                entity_id: scene.master_suite_all_low
              data:
                transition: 1

        - conditions:
            - condition: trigger
              id: reading
          sequence:
            - action: scene.turn_on
              target:
                entity_id: scene.master_suite_reading
              data:
                transition: 1

        - conditions:
            - condition: trigger
              id: all_off
          sequence:
            # Explicit entity lists, never area_id: these areas are also full of
            # Sonos config switches (loudness, crossfade, alarms) that an
            # area-wide turn_off would silently clobber.
            - action: light.turn_off
              target:
                entity_id:
                  - light.master_bedroom_master_bedroom_main_lights
                  - light.master_bedroom_master_bedroom_accent
                  - light.master_bedroom_master_bedroom_left_reading
                  - light.master_bedroom_master_bedroom_right_reading
                  - light.master_bathroom_master_bathroom_toilet
              data:
                transition: 2
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.master_closet_master_closet_entrance
                  - switch.master_closet_master_closet_main

# Backups are the whole disaster-recovery story (see RECOVERY.md), and a backup
# you believe is running is worse than no backup at all. Nothing was watching
# them until now.
#
# Two triggers, because they catch different failures:
#
#   event.backup_automatic_backup   fires per run with event_type completed /
#                                   failed / in_progress. This is the precise
#                                   "last night's backup did not work" signal.
#                                   Triggered on any state change and filtered
#                                   on the attribute rather than with
#                                   `attribute: event_type, to: failed`, because
#                                   an attribute trigger will not re-fire when
#                                   two consecutive runs both fail -- the
#                                   attribute never changes value.
#
#   sensor.backup_backup_manager_state -> blocked
#                                   catches the manager wedging outside of a
#                                   scheduled run, which the event entity would
#                                   never report. Held for 15 minutes first:
#                                   "blocked" is also briefly normal during a
#                                   restore, and alerting on that is noise.
- id: backup_failure_alert
  alias: Alert on backup failure
  description: >-
    Raise a persistent notification when an automatic backup fails or the backup
    manager gets stuck. Uses a fixed notification_id so repeat failures replace
    the previous notice instead of stacking up.
  mode: single
  triggers:
    - trigger: state
      entity_id: event.backup_automatic_backup
      id: run_failed
    - trigger: state
      entity_id: sensor.backup_backup_manager_state
      to: blocked
      for: "00:15:00"
      id: manager_blocked
  conditions:
    - condition: or
      conditions:
        - condition: trigger
          id: manager_blocked
        - condition: template
          value_template: >-
            {{ trigger.to_state.attributes.event_type | default('') == 'failed' }}
  actions:
    - action: persistent_notification.create
      data:
        notification_id: backup_failure
        title: Home Assistant backup failed
        message: >-
          {% if trigger.id == 'manager_blocked' %}
          The backup manager has been blocked for 15 minutes and is not making
          progress.
          {% else %}
          The automatic backup run failed.
          {% endif %}
          Last successful backup:
          {{ states('sensor.backup_last_successful_automatic_backup') }}.
          Check Settings > System > Backups.

# LG TV power-on. webostv has no way to turn on a TV that is fully off -- the
# TV is not listening -- so calling media_player.turn_on makes the integration
# fire this trigger instead, and this automation does the actual waking.
#
# Every "Turn On <device>" script in scripts.yaml starts with
# media_player.turn_on against the TV, so this is load-bearing for all of them,
# not just for turning the TV on by itself.
#
# The MAC is the TV's WIRED interface. Wake-on-LAN over Wi-Fi does not work
# reliably on these sets, and the wired and Wi-Fi MACs are different.
# wake_on_lan: is enabled in configuration.yaml.
#
# broadcast_address is NOT optional here, despite every example online omitting
# it. wake_on_lan defaults to 255.255.255.255, and Home Assistant Core runs in a
# container on the hassio bridge network (172.30.32.0/23) while the TV is on the
# LAN (192.168.55.0/24). A limited broadcast never leaves the bridge, so the
# packet is simply thrown away -- verified 2026-08-05: sending to
# 255.255.255.255 from inside the container fails outright with EACCES, while
# 192.168.55.255 goes out fine. The host itself is on 192.168.55.133, which is
# why the subnet-directed address works.
#
# Symptom if this regresses: "Turn On <anything>" appears to do nothing, because
# every one of those scripts starts by turning the TV on. The automation still
# shows as triggered -- the packet just goes nowhere.
- id: lg_tv_turn_on
  alias: LG TV -- wake on turn_on request
  description: >-
    Send a Wake-on-LAN magic packet when something asks the media room TV to
    turn on. Required because webOS cannot be reached while the TV is off.
  mode: single
  triggers:
    # Keyed on device_id, NOT entity_id, and that is deliberate.
    #
    # webostv exposes TURN_ON on the media_player only while a matching trigger
    # is attached to the TV's DEVICE -- see supported_features in
    # components/webostv/media_player.py, which ORs in TURN_ON only when the
    # coordinator's turn_on PluggableAction has a subscriber. The trigger's
    # attach step resolves entity_id -> device_id itself, so entity_id is
    # documented as valid, but going straight to the device_id removes that
    # lookup and matches what async_get_turn_on_trigger() registers.
    #
    # 2af5499... is the webostv device for media_player.media_room_tv
    # (identifier webostv/b9b54e49-e094-6ac6-48af-40f82d913480). If the TV is
    # ever removed and re-added, this id changes and must be updated here.
    - trigger: webostv.turn_on
      device_id: 2af549903901b8cf6eaa77d9936c6904
  actions:
    # Retry, do not fire once and hope. Two separate reasons:
    #
    # 1. Turning the TV off with its own remote leaves a window of a few seconds
    #    before the NIC is actually listening for magic packets. A packet sent
    #    into that window is silently dropped, which showed up as "the first
    #    turn-on after using the physical remote does nothing, the second works".
    # 2. webostv can still report "on" for a moment after the set powers off, so
    #    a naive until-condition would exit before sending anything useful.
    #    Hence at least two packets regardless of what the state says.
    #
    # Up to 5 attempts, 8s apart -- worst case ~40s, which fits inside the 45s
    # wait_template the turn_on_* scripts use. Extra packets are harmless: WoL is
    # idempotent and an already-awake TV ignores them.
    - repeat:
        sequence:
          - action: wake_on_lan.send_magic_packet
            data:
              mac: d0:cd:bf:95:0d:b1
              broadcast_address: 192.168.55.255
          - wait_template: "{{ is_state('media_player.media_room_tv', 'on') }}"
            timeout: "00:00:08"
            continue_on_timeout: true
        until:
          - condition: template
            value_template: >-
              {{ (repeat.index >= 2 and
              is_state('media_player.media_room_tv', 'on'))
              or repeat.index >= 5 }}
