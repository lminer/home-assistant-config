turn_on_bluray:
  alias: turn_on_blu_ray
  mode: single
  sequence:
  - target:
      entity_id: media_player.sony_xbr_85x900f
    action: media_player.turn_on
    data: {}
  - target:
      entity_id: media_player.tx_rz920
    action: media_player.turn_on
    data: {}
  - target:
      entity_id: remote.bravia_4k_gb_atv3
    data:
      command:
      - MEDIA_PLAY
    action: remote.send_command
  - delay: 00:00:02
  - data:
      source: DVD ··· BD/DVD
    action: media_player.select_source
    target:
      entity_id: media_player.tx_rz920
  - target:
      entity_id: media_player.tx_rz920
    data:
      is_volume_muted: false
    action: media_player.volume_mute
