turn_on_tv:
  alias: turn_on_tv
  mode: single
  sequence:
  - target:
      entity_id: media_player.sony_xbr_85x900f
    action: media_player.turn_on
  - target:
      entity_id: media_player.tx_rz920
    action: media_player.turn_on
  - delay: 00:00:02
  - target:
      entity_id: media_player.tx_rz920
    data:
      source: TV
    action: media_player.select_source
  - target:
      entity_id: media_player.tx_rz920
    data:
      is_volume_muted: false
    action: media_player.volume_mute
  - target:
      entity_id: media_player.tx_rz920
    data:
      volume_level: 0.35
    action: media_player.volume_set
  - target:
      entity_id: input_select.selected_remote
    data:
      option: tv
    action: input_select.select_option
  description: ''
turn_off_tv:
  alias: turn_off_tv
  mode: single
  sequence:
  - target:
      entity_id: media_player.sony_xbr_85x900f
    action: media_player.turn_off
  - delay: 00:00:01
  - target:
      entity_id: media_player.tx_rz920
    action: media_player.turn_off
  - target:
      entity_id: input_select.selected_remote
    data:
      option: none
    action: input_select.select_option
  description: ''
