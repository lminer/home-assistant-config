turn_on_ps5:
  alias: Turn On PS5
  sequence:
  - target:
      entity_id: media_player.media_room_tv
    action: media_player.turn_on
    data: {}
  - target:
      entity_id: media_player.denon_avr_x4700h
    action: media_player.turn_on
    data: {}
  - wait_template: >-
      {{ not is_state('media_player.denon_avr_x4700h', 'off') }}
    timeout: 00:00:15
    continue_on_timeout: true
  - delay: 00:00:02
  - target:
      entity_id: media_player.denon_avr_x4700h
    data:
      source: TV Audio
    action: media_player.select_source
  - wait_template: >-
      {{ is_state('media_player.media_room_tv', 'on') and 'Sony DVD Player' in
      (state_attr('media_player.media_room_tv', 'source_list') or []) }}
    timeout: 00:00:45
    continue_on_timeout: false
  - action: media_player.select_source
    target:
      entity_id:
      - media_player.media_room_tv
    data:
      source: Sony DVD Player
  description: >-
    The PS5 is wired straight into the TV, so this selects a TV input and puts
    the Denon on TV Audio to take the eARC return -- unlike every other source,
    which selects a Denon input. "Sony DVD Player" is the PS5's HDMI port: a
    stale CEC label the TV reports for physical HDMI 3. Note webOS hides inputs
    with nothing detected on them, so this source only appears once the PS5 is
    powered, which is what the wait below is really checking for.
  icon: mdi:sony-playstation
