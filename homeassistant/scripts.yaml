turn_on_blu_ray_player:
  alias: Turn On Blu-ray Player
  sequence:
  - target:
      entity_id: media_player.media_room_tv
    action: media_player.turn_on
    data: {}
  - target:
      entity_id: media_player.denon_avr_x4700h
    action: media_player.turn_on
    data: {}
  - wait_template: >-
      {{ not is_state('media_player.denon_avr_x4700h', 'off') }}
    timeout: 00:00:15
    continue_on_timeout: true
  - delay: 00:00:02
  - action: denonavr.get_command
    target:
      entity_id: media_player.denon_avr_x4700h
    data:
      command: /goform/formiPhoneAppDirect.xml?SIBD
  - if:
    - condition: state
      entity_id: media_player.media_room_bluray
      state:
      - 'off'
      - unknown
      - unavailable
    then:
    - action: remote.send_command
      target:
        entity_id: remote.ir_blaster
      data:
        device: bluray
        command: toggle power
  - wait_template: >-
      {{ is_state('media_player.media_room_tv', 'on') and 'AVR-X4700H' in
      (state_attr('media_player.media_room_tv', 'source_list') or []) }}
    timeout: 00:00:45
    continue_on_timeout: false
  - action: media_player.select_source
    target:
      entity_id:
      - media_player.media_room_tv
    data:
      source: AVR-X4700H
  description: >-
    This is the ONE Denon input not selected by name, and deliberately so. The
    receiver has TWO inputs both labelled "Panasonic BD" -- physical BD and 8K --
    so media_player.select_source cannot address it unambiguously: HA's
    source_list literally contains "Panasonic BD" twice, and the name-to-code
    lookup collapses, landing on the wrong input (observed: DVD, which sits
    directly before the first duplicate in the list).

    denonavr.get_command sends the raw control code instead, so it is immune to
    both the duplicate and to anyone renaming inputs later. SIBD selects physical
    input BD. If the Panasonic turns out to be on the 8K input instead, change
    this to SI8K -- those are the only two candidates, and both are confirmed
    selectable. Note SIDVD is NOT: that input is disabled on this receiver and
    silently redirects to 8K.

    The other sources still use select_source with names, which is fine because
    their labels are unique. Beware that denonavr does NOT validate names -- a
    wrong one is a silent no-op, not an error. Read the real labels off the
    receiver with `SSFUN ?` over telnet on port 23.
    The IR power step is guarded on the player's reported state so the toggle
    stays idempotent; that guard depends on Quick Start being OFF on the player,
    which is what lets it read "off" in standby. It runs before the TV wait so
    the player starts spinning up while the TV finishes booting.

    The guard matches off/unknown/unavailable rather than just off, and its
    counterpart in turn_off_blu_ray_player matches only the known-on states.
    Both are deliberate: an ambiguous state should still let the player be
    powered ON, but must never fire the toggle in the OFF direction, since that
    would switch off a player that was only briefly unreachable. Matching just
    "off" here meant a player HA had not polled yet was silently never woken.
  icon: mdi:disc
turn_on_television:
  alias: Turn On Television
  sequence:
  - target:
      entity_id: media_player.media_room_tv
    action: media_player.turn_on
    data: {}
  - target:
      entity_id: media_player.denon_avr_x4700h
    action: media_player.turn_on
    data: {}
  - wait_template: >-
      {{ not is_state('media_player.denon_avr_x4700h', 'off') }}
    timeout: 00:00:15
    continue_on_timeout: true
  - delay: 00:00:02
  - target:
      entity_id: media_player.denon_avr_x4700h
    data:
      source: TV Audio
    action: media_player.select_source
  - wait_template: >-
      {{ is_state('media_player.media_room_tv', 'on') and 'Live TV' in
      (state_attr('media_player.media_room_tv', 'source_list') or []) }}
    timeout: 00:00:45
    continue_on_timeout: false
  - action: media_player.select_source
    target:
      entity_id:
      - media_player.media_room_tv
    data:
      source: Live TV
  description: >-
    This tile means the set's own tuner, so the last step is not optional: the TV
    does not start from nowhere. Coming from Blu-ray, Apple TV, Mac Mini or
    Switch it is parked on AVR-X4700H, and without the select_source below it
    stays there -- the Denon moves to TV Audio while the screen still shows the
    receiver's now-idle HDMI port, so you get a blank picture and eARC pointed at
    a TV that is not sourcing anything.

    Denon first, TV second, for the same reason as the other scripts: a cold
    Wake-on-LAN start takes longer than the receiver needs. The wait gates on
    'Live TV' actually being in the TV's source_list rather than on the TV merely
    reporting "on", because webOS publishes its input list a few seconds after it
    starts answering.
  icon: mdi:television-classic
learn_bluray_commands:
  alias: Learn Blu-ray Commands
  sequence:
  - action: remote.learn_command
    target:
      entity_id: remote.ir_blaster
    data:
      device: bluray
      command:
      - toggle power
      - up
      - down
      - left
      - right
      - select
      - play
      - pause
      - stop
      - fforward
      - rewind
      - prev
      - next
      - home
      - return
      - open close
  description: >-
    Re-learn the Panasonic DP-UB820's IR codes into the Broadlink RM4, under the
    "bluray" device group. Point the Panasonic remote at the blaster and run it;
    each command raises a "Learn command" persistent notification and gives you
    30 seconds to press that button. Codes are saved one at a time as they are
    captured, but a single timeout aborts the rest of the run -- just re-run it,
    since re-learning simply overwrites. The command names here must match the
    ones the Blu-ray panel in dashboards/media-center.yaml sends. Deliberately
    16 commands: the UB820 remote has no subtitle or audio key, so those cannot
    be learned and are not on the panel.
  icon: mdi:remote
turn_off_blu_ray_player:
  alias: Turn off Blu-ray Player
  sequence:
  - data:
      option: none
    action: input_select.select_option
    target:
      entity_id: input_select.selected_remote
  - if:
    - condition: state
      entity_id: media_player.media_room_bluray
      state:
      - 'on'
      - idle
      - playing
      - paused
    then:
    - action: remote.send_command
      target:
        entity_id: remote.ir_blaster
      data:
        device: bluray
        command: toggle power
  - target:
      entity_id: media_player.media_room_tv
    action: media_player.turn_off
    data: {}
  - target:
      entity_id: media_player.denon_avr_x4700h
    action: media_player.turn_off
    data: {}
  description: ''
  icon: mdi:power
