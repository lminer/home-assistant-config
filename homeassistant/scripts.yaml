turn_on_apple_tv:
  alias: Turn On Apple TV
  sequence:
  - target:
      entity_id: media_player.media_room_tv
    action: media_player.turn_on
    data: {}
  - target:
      entity_id: media_player.denon_avr_x4700h
    action: media_player.turn_on
    data: {}
  - wait_template: >-
      {{ not is_state('media_player.denon_avr_x4700h', 'off') }}
    timeout: 00:00:15
    continue_on_timeout: true
  - delay: 00:00:02
  - target:
      entity_id: media_player.denon_avr_x4700h
    data:
      source: Apple TV
    action: media_player.select_source
  - wait_template: >-
      {{ is_state('media_player.media_room_tv', 'on') and 'AVR-X4700H' in
      (state_attr('media_player.media_room_tv', 'source_list') or []) }}
    timeout: 00:00:45
    continue_on_timeout: false
  - action: media_player.select_source
    target:
      entity_id:
      - media_player.media_room_tv
    data:
      source: AVR-X4700H
  - delay: 00:00:01
  - target:
      entity_id: remote.appletv_duncan
    action: remote.send_command
    data:
      hold_secs: 1
      delay_secs: 1
      command:
      - home
  description: >-
    The receiver is set up first, while the TV is still booting, because a cold
    Wake-on-LAN start takes longer than the Denon needs. The wait then gates on
    the source actually being present in the TV's source_list, not merely on the
    TV reporting "on" -- webOS publishes its input list a few seconds after it
    starts answering, and calling select_source before then fails with
    "source not found".
  icon: mdi:apple
