turn_on_apple_tv:
  alias: Turn On Apple TV
  sequence:
  - target:
      entity_id: media_player.media_room_tv
    action: media_player.turn_on
    data: {}
  - wait_template: '{{ is_state(''media_player.media_room_tv'', ''on'') }}'
    timeout: 00:00:20
    continue_on_timeout: true
  - action: media_player.select_source
    target:
      entity_id:
      - media_player.media_room_tv
    data:
      source: AVR-X4700H
  - target:
      entity_id: media_player.denon_avr_x4700h
    action: media_player.turn_on
    data: {}
  - target:
      entity_id: media_player.denon_avr_x4700h
    data:
      source: Apple TV
    action: media_player.select_source
  - delay: 00:00:01
  - target:
      entity_id: remote.appletv_duncan
    action: remote.send_command
    data:
      hold_secs: 1
      delay_secs: 1
      command:
      - home
  description: ''
  icon: mdi:apple
