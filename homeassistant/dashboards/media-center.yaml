kiosk_mode:
  hide_header: true

title: Media Center
views:
  - title: Media Center
    path: home
    icon: mdi:remote-tv
    theme: ios-dark-mode-blue-red
    cards:
      # ===== TOP NAV BAR =====
      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              position: static;
              z-index: 3;
              top: 8px;
              left: 8px;
              right: 8px;
              height: 45px;
              padding: 4px 10px;
              border-radius: 10px;
              background-color: rgba(10, 10, 10, .5);
              -webkit-backdrop-filter: blur(100px);
              backdrop-filter: blur(100px);
            }
        card:
          type: grid
          square: false
          columns: 1
          cards:
            - type: custom:mushroom-chips-card
              chips:
                - type: back
                  icon: mdi:arrow-left
                - type: spacer
                - type: template
                  entity: input_select.selected_remote
                  icon: local:tv-retro-regular
                  icon_color: '#0171A4'
                  content: >-
                    {% if states('input_select.selected_remote') == 'none' %}
                      Select Device
                    {% elif states('input_select.selected_remote') == 'appletv' %}
                      Apple TV
                    {% elif states('input_select.selected_remote') == 'bluray' %}
                      Blu-ray
                    {% elif states('input_select.selected_remote') == 'tv' %}
                      Television
                    {% elif states('input_select.selected_remote') == 'switch' %}
                      Nintendo Switch
                    {% endif %}
                  tap_action:
                    action: perform-action
                    perform_action: input_select.select_option
                    data:
                      option: none
                    target:
                      entity_id: input_select.selected_remote
                  card_mod:
                    style: |
                      ha-card {
                        --chip-padding: 4px;
                      }
                - type: spacer
                - type: entity
                  entity: media_player.tx_rz920
                  tap_action:
                    action: perform-action
                    perform_action: script.turn_off_all_media
                  icon: mdi:power
                  content_info: none
                  card_mod:
                    style: |
                      ha-card {
                        --chip-padding: 4px;
                      }
              card_mod:
                style: |
                  :host {
                    --chip-background: rgba(0, 0, 0, 0) !important;
                    --mush-card-primary-font-size: 28px;
                  }
                  ha-card {
                    --card-primary-font-size: 30px !important;
                    --card-secondary-font-size: 30px;
                    --chip-icon-size: 15px;
                  }

      # ===== DEVICE SELECTION (when no remote selected) =====
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.selected_remote
            state: none
        card:
          type: vertical-stack
          cards:
            # Section Header
            - type: custom:mushroom-template-card
              primary: Media Center
              secondary: ''
              icon: local:tv-retro-regular
              badge_icon: ''
              card_mod:
                style:
                  .: |
                    ha-card {
                      background: transparent;
                      --card-primary-font-size: 22px !important;
                      --card-secondary-font-size: 50px !important;
                      --card-primary-line-height: 25px;
                      overflow: visible;
                      top: 10px;
                      right: 10px;
                      padding-bottom: 5px;
                      padding-top: 10px;
                    }
                    ha-state-icon {
                      --icon-symbol-size: 18px;
                    }
                  mushroom-shape-icon$: |
                    .shape {
                      padding-right: 0px;
                      padding-left: 0px;
                      padding-bottom: 0px;
                      padding-top: 0px;
                      left: 5px;
                      background: transparent !important;
                    }
                  mushroom-state-info$: |
                    .container {
                      --card-secondary-font-size: 18px;
                      --card-primary-font-size: 18px;
                    }

            # Row 1: Apple TV | Blu-ray
            - type: horizontal-stack
              cards:
                - type: custom:button-card
                  name: Apple TV
                  icon: mdi:apple
                  show_state: false
                  tap_action:
                    action: perform-action
                    perform_action: script.turn_on_appletv
                  styles:
                    card:
                      - padding: 0px
                      - height: 128px
                      - border-radius: 10px
                    grid:
                      - grid-template-areas: '"i" "n"'
                      - grid-template-columns: 1fr
                      - grid-template-rows: 1fr min-content
                    img_cell:
                      - align-self: center
                      - text-align: center
                    icon:
                      - width: 40px
                      - color: white
                    name:
                      - justify-self: center
                      - font-weight: 600
                      - font-size: 14px
                      - padding-bottom: 15px

                - type: custom:button-card
                  name: Blu-ray
                  icon: mdi:disc-player
                  show_state: false
                  tap_action:
                    action: perform-action
                    perform_action: script.turn_on_bluray
                  styles:
                    card:
                      - padding: 0px
                      - height: 128px
                      - border-radius: 10px
                    grid:
                      - grid-template-areas: '"i" "n"'
                      - grid-template-columns: 1fr
                      - grid-template-rows: 1fr min-content
                    img_cell:
                      - align-self: center
                      - text-align: center
                    icon:
                      - width: 40px
                      - color: white
                    name:
                      - justify-self: center
                      - font-weight: 600
                      - font-size: 14px
                      - padding-bottom: 15px

            # Row 2: Nintendo Switch | Television
            - type: horizontal-stack
              cards:
                - type: custom:button-card
                  name: Nintendo Switch
                  icon: mdi:nintendo-switch
                  show_state: false
                  tap_action:
                    action: perform-action
                    perform_action: script.turn_on_game
                  styles:
                    card:
                      - padding: 0px
                      - height: 128px
                      - border-radius: 10px
                    grid:
                      - grid-template-areas: '"i" "n"'
                      - grid-template-columns: 1fr
                      - grid-template-rows: 1fr min-content
                    img_cell:
                      - align-self: center
                      - text-align: center
                    icon:
                      - width: 40px
                      - color: white
                    name:
                      - justify-self: center
                      - font-weight: 600
                      - font-size: 14px
                      - padding-bottom: 15px

                - type: custom:button-card
                  name: Television
                  icon: mdi:television-classic
                  show_state: false
                  tap_action:
                    action: perform-action
                    perform_action: script.turn_on_tv
                  styles:
                    card:
                      - padding: 0px
                      - height: 128px
                      - border-radius: 10px
                    grid:
                      - grid-template-areas: '"i" "n"'
                      - grid-template-columns: 1fr
                      - grid-template-rows: 1fr min-content
                    img_cell:
                      - align-self: center
                      - text-align: center
                    icon:
                      - width: 40px
                      - color: white
                    name:
                      - justify-self: center
                      - font-weight: 600
                      - font-size: 14px
                      - padding-bottom: 15px

            # Spacer for bottom nav
            - type: custom:gap-card
              height: 50

      # ===== APPLE TV REMOTE =====
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.selected_remote
            state: appletv
        card:
          type: vertical-stack
          card_mod:
            style:
              .: |
                #root {
                  gap: 0 !important;
                }
                #root > * {
                  margin-top: 0 !important;
                  margin-bottom: 0 !important;
                }
              hui-vertical-stack-card$: |
                #root {
                  gap: 0 !important;
                }
                #root > * {
                  margin-top: 0 !important;
                  margin-bottom: 0 !important;
                }
          cards:
            # ---- Streaming App Launcher Bar ----
            - type: custom:mod-card
              card_mod:
                style: |
                  :host {
                    margin-bottom: 0 !important;
                  }
                  ha-card {
                    background: rgba(0, 0, 0, 0.5);
                    border-radius: 10px 10px 0px 0px;
                    padding: 0px 30px;
                    box-shadow: none;
                  }
              card:
                type: grid
                square: false
                columns: 5
                cards:
                  - type: custom:button-card
                    icon: mdi:apple
                    tap_action:
                      action: perform-action
                      perform_action: media_player.select_source
                      target:
                        entity_id: media_player.trinity_2
                      data:
                        source: TV
                    styles:
                      icon:
                        - width: 25px
                        - color: rgba(255,255,255,0.8)
                      img_cell:
                        - width: 40px
                        - height: 40px
                      card:
                        - background: none
                        - padding: 0
                  - type: custom:button-card
                    icon: mdi:netflix
                    tap_action:
                      action: perform-action
                      perform_action: media_player.select_source
                      target:
                        entity_id: media_player.trinity_2
                      data:
                        source: Netflix
                    styles:
                      icon:
                        - width: 25px
                        - color: rgba(255,255,255,0.8)
                      img_cell:
                        - width: 40px
                        - height: 40px
                      card:
                        - background: none
                        - padding: 0
                  - type: custom:button-card
                    show_icon: false
                    show_name: false
                    custom_fields:
                      img: '<img src="/local/images/disney-plus.svg" style="width:25px;height:25px;opacity:0.8;">'
                    tap_action:
                      action: perform-action
                      perform_action: media_player.select_source
                      target:
                        entity_id: media_player.trinity_2
                      data:
                        source: Disney+
                    styles:
                      custom_fields:
                        img:
                          - display: flex
                          - justify-content: center
                          - align-items: center
                          - width: 40px
                          - height: 40px
                      card:
                        - background: none
                        - padding: 0
                  - type: custom:button-card
                    show_icon: false
                    show_name: false
                    custom_fields:
                      img: '<img src="/local/images/prime-video.svg" style="width:25px;height:25px;opacity:0.8;">'
                    tap_action:
                      action: perform-action
                      perform_action: media_player.select_source
                      target:
                        entity_id: media_player.trinity_2
                      data:
                        source: Prime Video
                    styles:
                      custom_fields:
                        img:
                          - display: flex
                          - justify-content: center
                          - align-items: center
                          - width: 40px
                          - height: 40px
                      card:
                        - background: none
                        - padding: 0
                  - type: custom:button-card
                    icon: mdi:hulu
                    tap_action:
                      action: perform-action
                      perform_action: media_player.select_source
                      target:
                        entity_id: media_player.trinity_2
                      data:
                        source: Hulu
                    styles:
                      icon:
                        - width: 25px
                        - color: rgba(255,255,255,0.8)
                      img_cell:
                        - width: 40px
                        - height: 40px
                      card:
                        - background: none
                        - padding: 0

            # ---- Touchpad (fills main area) ----
            - type: custom:android-tv-card
              remote_id: remote.trinity_2
              keyboard_id: remote.trinity_2
              media_player_id: media_player.trinity_2
              platform: Apple TV
              rows:
                - - touchpad
              custom_actions:
                - type: touchpad
                  name: touchpad
                  tap_action:
                    action: key
                    key: select
                  double_tap_action:
                    action: key
                    key: menu
                  up:
                    tap_action:
                      action: key
                      key: up
                    hold_action:
                      action: repeat
                  down:
                    tap_action:
                      action: key
                      key: down
                    hold_action:
                      action: repeat
                  left:
                    tap_action:
                      action: key
                      key: left
                    hold_action:
                      action: repeat
                  right:
                    tap_action:
                      action: key
                      key: right
                    hold_action:
                      action: repeat
                  styles: |-
                    toucharea {
                      height: 410px;
                      background-image: url('https://i.ibb.co/pbf8yC8/swipe-nav.png');
                      background-color: rgba(0,0,0,0);
                      background-size: 55%;
                      background-repeat: no-repeat;
                      background-position: center;
                      border-radius: 0px;
                      opacity: 1;
                      padding-bottom: 20px;
                    }
              card_mod:
                style: |
                  :host {
                    margin-top: 0 !important;
                    margin-bottom: 0 !important;
                  }
                  ha-card {
                    background: rgba(0, 0, 0, 0.5);
                    border-radius: 0px;
                    padding: 0px !important;
                    box-shadow: none;
                  }

            # ---- Bottom Control Panel ----
            - type: custom:button-card
              show_icon: false
              show_name: false
              show_state: false
              entity: media_player.trinity_2
              styles:
                grid:
                  - grid-template-areas: '"seekbar" "transport" "vol"'
                  - grid-template-columns: 1fr
                  - grid-template-rows: min-content min-content min-content
                card:
                  - background-color: rgba(0,0,0,0.5)
                  - box-shadow: none
                  - border-radius: 0px 0px 10px 10px
                  - border-width: 0px
                  - padding: 15px
                  - margin: 0px
                  - height: 185px
              custom_fields:
                seekbar:
                  card:
                    type: custom:android-tv-card
                    remote_id: remote.trinity_2
                    media_player_id: media_player.trinity_2
                    rows:
                      - - media_position
                    custom_actions:
                      - type: slider
                        name: media_position
                        value_attribute: media_position
                        range:
                          - 0
                          - "{{ state_attr(config.entity, 'media_duration') }}"
                        tap_action:
                          action: perform-action
                          perform_action: media_player.media_seek
                          data:
                            seek_position: "{{ value }}"
                        step: 1
                        styles: |-
                          :host {
                            --thumb-width: 5px;
                            --tooltip-label: '{{ (value / 60) | int }}:{{ 0 if (value - 60*((value / 60) | int)) < 10 else "" }}{{ (value - 60*((value / 60) | int)) | int }}';
                            height: 11px;
                            border-radius: 4px;
                          }
                          .label {
                            filter: invert(1);
                            mix-blend-mode: difference;
                          }
                        label: >-
                          {% set minutes = (value / 60) | int %} {% set seconds
                          = (value - 60 * minutes) | int %} {{ minutes }}:{{ 0
                          if seconds < 10 else "" }}{{ seconds | int }}/{{
                          (state_attr(config.entity, "media_duration") / 60) |
                          int }}:{{ 0 if (state_attr(config.entity,
                          "media_duration") - 60*((state_attr(config.entity,
                          "media_duration") / 60) | int)) < 10 else "" }}{{
                          (state_attr(config.entity, "media_duration") -
                          60*((state_attr(config.entity, "media_duration") / 60)
                          | int)) | int }}
                    card_mod:
                      style: |
                        ha-card {
                          background: none;
                          box-shadow: none;
                          border: none;
                          padding: 0;
                          margin: 0;
                        }
                transport:
                  card:
                    type: custom:button-card
                    show_icon: false
                    show_name: false
                    custom_fields:
                      skip_back:
                        card:
                          type: custom:button-card
                          tap_action:
                            action: perform-action
                            perform_action: remote.send_command
                            target:
                              entity_id: remote.trinity_2
                            data:
                              command: skip_backward
                          icon: mdi:rewind-10
                          show_name: false
                          styles:
                            card:
                              - background: rgba(255,255,255,0.0)
                              - box-shadow: none
                              - border-width: 0px
                              - padding: 0px
                            icon:
                              - width: 20px
                              - color: rgba(255,255,255,0.5)
                      menu_back:
                        card:
                          type: custom:button-card
                          tap_action:
                            action: perform-action
                            perform_action: remote.send_command
                            target:
                              entity_id: remote.trinity_2
                            data:
                              command: menu
                          icon: mdi:backspace
                          show_name: false
                          styles:
                            card:
                              - background: rgba(255,255,255,0.0)
                              - box-shadow: none
                              - border-width: 0px
                              - padding: 0px
                            icon:
                              - width: 40px
                              - color: rgba(255,255,255,0.8)
                      play_pause:
                        card:
                          type: custom:button-card
                          entity: media_player.trinity_2
                          tap_action:
                            action: perform-action
                            perform_action: media_player.media_play_pause
                            target:
                              entity_id: media_player.trinity_2
                          icon: mdi:play
                          state:
                            - value: playing
                              icon: mdi:pause
                          show_name: false
                          styles:
                            card:
                              - background: rgba(255,255,255,0.0)
                              - box-shadow: none
                              - border-width: 0px
                              - padding: 0px
                            icon:
                              - width: 55px
                              - color: rgba(255,255,255,0.8)
                      home_btn:
                        card:
                          type: custom:button-card
                          tap_action:
                            action: url
                            url_path: "tvremote://"
                          icon: mdi:remote
                          show_name: false
                          styles:
                            card:
                              - background: rgba(255,255,255,0.0)
                              - box-shadow: none
                              - border-width: 0px
                              - padding: 0px
                            icon:
                              - width: 40px
                              - color: rgba(255,255,255,0.8)
                      skip_fwd:
                        card:
                          type: custom:button-card
                          tap_action:
                            action: perform-action
                            perform_action: remote.send_command
                            target:
                              entity_id: remote.trinity_2
                            data:
                              command: skip_forward
                          icon: mdi:fast-forward-10
                          show_name: false
                          styles:
                            card:
                              - background: rgba(255,255,255,0.0)
                              - box-shadow: none
                              - border-width: 0px
                              - padding: 0px
                            icon:
                              - width: 20px
                              - color: rgba(255,255,255,0.5)
                    styles:
                      grid:
                        - grid-template-columns: 2fr 3fr 3fr 3fr 2fr
                        - grid-template-rows: min-content
                        - grid-template-areas: '"skip_back menu_back play_pause home_btn skip_fwd"'
                      card:
                        - padding: 0
                        - margin: 3px 0px 0px 0px
                        - background: none
                        - box-shadow: none
                        - border-width: 0px
                vol:
                  card:
                    type: custom:android-tv-card
                    remote_id: remote.trinity_2
                    media_player_id: media_player.tx_rz920
                    rows:
                      - - mute
                        - volume
                        - volume_up
                    custom_actions:
                      - type: slider
                        name: volume
                        range:
                          - 0
                          - 1
                        step: 0.01
                        value_attribute: volume_level
                        tap_action:
                          action: perform-action
                          perform_action: media_player.volume_set
                          data:
                            volume_level: "{{ value | float }}"
                        styles: ":host {\n  height: 20px;\n}"
                        entity_id: media_player.tx_rz920
                        icon: ""
                      - type: button
                        name: mute
                        entity_id: media_player.tx_rz920
                        tap_action:
                          action: perform-action
                          perform_action: media_player.volume_mute
                          target:
                            entity_id: media_player.tx_rz920
                        icon: mdi:volume-off
                        styles: ".icon {\n  --size: 30px;\n}"
                      - type: button
                        name: volume_up
                        tap_action:
                          action: perform-action
                          perform_action: media_player.volume_up
                          target:
                            entity_id: media_player.tx_rz920
                        hold_action:
                          action: repeat
                        icon: mdi:volume-plus
                        styles: ".icon {\n  --size: 30px;\n}"
                    card_mod:
                      style: |
                        ha-card {
                          background: none;
                          box-shadow: none;
                          border: none;
                          padding: 0;
                          margin: 0;
                        }
              card_mod:
                style: |
                  :host {
                    margin-top: 0 !important;
                  }
                  ha-card {
                    border-width: 0px;
                    box-shadow: none;
                  }

            # Spacer for bottom nav
            - type: custom:gap-card
              height: 50

      # ===== BLU-RAY REMOTE =====
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.selected_remote
            state: bluray
        card:
          type: vertical-stack
          cards:
            - type: custom:android-tv-card
              card_mod:
                style: |
                  ha-card {
                    background: rgba(0, 0, 0, 0.5);
                    backdrop-filter: blur(20px);
                    -webkit-backdrop-filter: blur(20px);
                    border-radius: 10px;
                  }
              rows:
                - - power
                  - return
                  - eject
                - - dpad
                - - home
                - - rewind
                  - play
                  - fast_forward
                - - prev
                  - pause
                  - next
                - - subtitle
                  - stop
                  - audio
                - - mute
                  - volume
                  - volume_up
              custom_actions:
                - type: button
                  name: power
                  tap_action:
                    action: perform-action
                    perform_action: script.turn_off_blu_ray_player
                    key: POWER
                  icon: mdi:power
                - type: button
                  name: up
                  tap_action:
                    action: perform-action
                    perform_action: remote.send_command
                    data:
                      device: television
                      command: up
                    target:
                      entity_id: remote.bravia_4k_gb_atv3
                    key: Up
                  hold_action:
                    action: repeat
                  icon: mdi:chevron-up
                  entity_id: remote.bravia_4k_gb_atv3
                - type: button
                  name: down
                  tap_action:
                    action: perform-action
                    perform_action: remote.send_command
                    data:
                      device: television
                      command: down
                    target:
                      entity_id: remote.bravia_4k_gb_atv3
                    key: Down
                  hold_action:
                    action: repeat
                  icon: mdi:chevron-down
                  entity_id: remote.bravia_4k_gb_atv3
                - type: button
                  name: left
                  tap_action:
                    action: perform-action
                    perform_action: remote.send_command
                    data:
                      device: television
                      command: left
                    target:
                      entity_id: remote.bravia_4k_gb_atv3
                    key: Left
                  hold_action:
                    action: repeat
                  icon: mdi:chevron-left
                  entity_id: remote.bravia_4k_gb_atv3
                - type: button
                  name: right
                  tap_action:
                    action: perform-action
                    perform_action: remote.send_command
                    data:
                      device: television
                      command: right
                    target:
                      entity_id: remote.bravia_4k_gb_atv3
                    key: Right
                  hold_action:
                    action: repeat
                  icon: mdi:chevron-right
                  entity_id: remote.bravia_4k_gb_atv3
                - type: button
                  name: center
                  tap_action:
                    action: perform-action
                    perform_action: remote.send_command
                    data:
                      device: television
                      command: select
                    target:
                      entity_id: remote.bravia_4k_gb_atv3
                    key: Select
                  icon: mdi:circle
                  entity_id: remote.bravia_4k_gb_atv3
                - type: button
                  name: play
                  tap_action:
                    action: perform-action
                    perform_action: remote.send_command
                    data:
                      device: television
                      command: play
                    target:
                      entity_id: remote.bravia_4k_gb_atv3
                    key: Play
                  icon: mdi:play
                  entity_id: remote.bravia_4k_gb_atv3
                - type: button
                  name: pause
                  tap_action:
                    action: perform-action
                    perform_action: remote.send_command
                    data:
                      device: television
                      command: pause
                    target:
                      entity_id: remote.bravia_4k_gb_atv3
                    key: Pause
                  icon: mdi:pause
                  entity_id: remote.bravia_4k_gb_atv3
                - type: button
                  name: stop
                  tap_action:
                    action: perform-action
                    perform_action: remote.send_command
                    data:
                      device: television
                      command: stop
                    target:
                      entity_id: remote.bravia_4k_gb_atv3
                    key: Stop
                  icon: mdi:stop
                  entity_id: remote.bravia_4k_gb_atv3
                - type: button
                  name: fast_forward
                  tap_action:
                    action: perform-action
                    perform_action: remote.send_command
                    data:
                      device: television
                      command: fforward
                    target:
                      entity_id: remote.bravia_4k_gb_atv3
                    key: fast_forward
                  icon: mdi:fast-forward
                  entity_id: remote.bravia_4k_gb_atv3
                - type: button
                  name: rewind
                  tap_action:
                    action: perform-action
                    perform_action: remote.send_command
                    data:
                      device: television
                      command: rewind
                    target:
