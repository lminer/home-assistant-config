kiosk_mode:
  hide_header: true

title: Climate
views:
  - title: Climate Overview
    path: home
    icon: mdi:fan
    theme: ios-dark-mode-blue-red
    cards:
      # ===== TOP NAV BAR =====
      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              position: static;
              z-index: 3;
              top: 8px;
              left: 8px;
              right: 8px;
              height: 45px;
              padding: 4px 10px;
              border-radius: 10px;
              background-color: rgba(10, 10, 10, .5);
              -webkit-backdrop-filter: blur(100px);
              backdrop-filter: blur(100px);
            }
        card:
          type: grid
          square: false
          columns: 1
          cards:
            - type: custom:mushroom-chips-card
              chips:
                - type: back
                  icon: mdi:arrow-left
                - type: spacer
                - type: template
                  icon: local:circle-sort-regular
                  icon_color: '#0171A4'
                  content: Climate Overview
                  card_mod:
                    style: |
                      ha-card {
                        --chip-padding: 4px;
                      }
                - type: spacer
              card_mod:
                style: |
                  :host {
                    --chip-background: rgba(0, 0, 0, 0) !important;
                    --mush-card-primary-font-size: 28px;
                  }
                  ha-card {
                    --card-primary-font-size: 30px !important;
                    --card-secondary-font-size: 30px;
                    --chip-icon-size: 15px;
                  }

      # ===== THERMOSTATS SECTION =====
      #
      # Five of the eight thermostats are physically mounted in a different room
      # than the coils they control, so their on-unit temperature reading says
      # nothing useful about the room being conditioned. Each of those five has a
      # paired Ecobee SmartSensor (linked as a child device in the device registry)
      # that sits in the right room.
      #
      # mushroom-climate-card always builds its secondary line as
      # "<hvac state> ⸱ <on-unit current_temperature>" with no option to suppress
      # the temperature, so the five relocated units blank that line via card_mod
      # and rebuild it from the remote sensor. Main Floor HVAC, Bottom Floor HVAC,
      # and Basement have no remote sensor and are left as-is.
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: ''
            subtitle: Thermostats
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-climate-card
                entity: climate.master_suite
                name: Master Suite
                show_temperature_control: true
                card_mod:
                  style:
                    mushroom-state-item mushroom-state-info$: |
                      .secondary { font-size: 0; }
                      .secondary:after {
                        font-size: var(--card-secondary-font-size, 12px);
                        content: "{{ states(config.entity) | replace('_', ' ') | title }} ⸱ {% set t = 'sensor.smartsensor_temperature' %}{{ states(t) }}{{ state_attr(t, 'unit_of_measurement') or '' }}";
                      }
                    .: |
                      ha-card {
                        {% if state_attr(config.entity, 'hvac_action') == 'cooling' %}
                          background-color: rgba(255, 255, 255, 0.8) !important;
                          --primary-text-color: black;
                          --secondary-text-color: #333;
                        {% elif state_attr(config.entity, 'hvac_action') == 'heating' %}
                          background-color: rgba(255, 255, 255, 0.8) !important;
                          --primary-text-color: black;
                          --secondary-text-color: #333;
                        {% endif %}
                      }
              - type: custom:mushroom-climate-card
                entity: climate.family_room_study
                name: Family Room / Study
                show_temperature_control: true
                card_mod:
                  style:
                    mushroom-state-item mushroom-state-info$: |
                      .secondary { font-size: 0; }
                      .secondary:after {
                        font-size: var(--card-secondary-font-size, 12px);
                        content: "{{ states(config.entity) | replace('_', ' ') | title }} ⸱ {% set t = 'sensor.living_room_temperature' %}{{ states(t) }}{{ state_attr(t, 'unit_of_measurement') or '' }}";
                      }
                    .: |
                      ha-card {
                        {% if state_attr(config.entity, 'hvac_action') == 'cooling' %}
                          background-color: rgba(255, 255, 255, 0.8) !important;
                          --primary-text-color: black;
                          --secondary-text-color: #333;
                        {% elif state_attr(config.entity, 'hvac_action') == 'heating' %}
                          background-color: rgba(255, 255, 255, 0.8) !important;
                          --primary-text-color: black;
                          --secondary-text-color: #333;
                        {% endif %}
                      }
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-climate-card
                entity: climate.kids_bed_bath_1
                name: Kids Bed/Bath 1
                show_temperature_control: true
                card_mod:
                  style:
                    mushroom-state-item mushroom-state-info$: |
                      .secondary { font-size: 0; }
                      .secondary:after {
                        font-size: var(--card-secondary-font-size, 12px);
                        content: "{{ states(config.entity) | replace('_', ' ') | title }} ⸱ {% set t = 'sensor.kids_room_1_temperature' %}{{ states(t) }}{{ state_attr(t, 'unit_of_measurement') or '' }}";
                      }
                    .: |
                      ha-card {
                        {% if state_attr(config.entity, 'hvac_action') == 'cooling' %}
                          background-color: rgba(255, 255, 255, 0.8) !important;
                          --primary-text-color: black;
                          --secondary-text-color: #333;
                        {% elif state_attr(config.entity, 'hvac_action') == 'heating' %}
                          background-color: rgba(255, 255, 255, 0.8) !important;
                          --primary-text-color: black;
                          --secondary-text-color: #333;
                        {% endif %}
                      }
              - type: custom:mushroom-climate-card
                entity: climate.kids_bed_bath_2
                name: Kids Bed/Bath 2
                show_temperature_control: true
                card_mod:
                  style:
                    mushroom-state-item mushroom-state-info$: |
                      .secondary { font-size: 0; }
                      .secondary:after {
                        font-size: var(--card-secondary-font-size, 12px);
                        content: "{{ states(config.entity) | replace('_', ' ') | title }} ⸱ {% set t = 'sensor.kids_2_temperature' %}{{ states(t) }}{{ state_attr(t, 'unit_of_measurement') or '' }}";
                      }
                    .: |
                      ha-card {
                        {% if state_attr(config.entity, 'hvac_action') == 'cooling' %}
                          background-color: rgba(255, 255, 255, 0.8) !important;
                          --primary-text-color: black;
                          --secondary-text-color: #333;
                        {% elif state_attr(config.entity, 'hvac_action') == 'heating' %}
                          background-color: rgba(255, 255, 255, 0.8) !important;
                          --primary-text-color: black;
                          --secondary-text-color: #333;
                        {% endif %}
                      }
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-climate-card
                entity: climate.clea_hall
                name: Clea Hall
                show_temperature_control: true
                card_mod:
                  style:
                    mushroom-state-item mushroom-state-info$: |
                      .secondary { font-size: 0; }
                      .secondary:after {
                        font-size: var(--card-secondary-font-size, 12px);
                        content: "{{ states(config.entity) | replace('_', ' ') | title }} ⸱ {% set t = 'sensor.clea_room_sensor_temperature' %}{{ states(t) }}{{ state_attr(t, 'unit_of_measurement') or '' }}";
                      }
                    .: |
                      ha-card {
                        {% if state_attr(config.entity, 'hvac_action') == 'cooling' %}
                          background-color: rgba(255, 255, 255, 0.8) !important;
                          --primary-text-color: black;
                          --secondary-text-color: #333;
                        {% elif state_attr(config.entity, 'hvac_action') == 'heating' %}
                          background-color: rgba(255, 255, 255, 0.8) !important;
                          --primary-text-color: black;
                          --secondary-text-color: #333;
                        {% endif %}
                      }
              - type: custom:mushroom-climate-card
                entity: climate.main_floor_hvac
                name: Main Floor HVAC
                show_temperature_control: true
                card_mod:
                  style: |
                    ha-card {
                      {% if state_attr(config.entity, 'hvac_action') == 'cooling' %}
                        background-color: rgba(255, 255, 255, 0.8) !important;
                        --primary-text-color: black;
                        --secondary-text-color: #333;
                      {% elif state_attr(config.entity, 'hvac_action') == 'heating' %}
                        background-color: rgba(255, 255, 255, 0.8) !important;
                        --primary-text-color: black;
                        --secondary-text-color: #333;
                      {% endif %}
                    }
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-climate-card
                entity: climate.bottom_floor_hvac
                name: Bottom Floor HVAC
                show_temperature_control: true
                card_mod:
                  style: |
                    ha-card {
                      {% if state_attr(config.entity, 'hvac_action') == 'cooling' %}
                        background-color: rgba(255, 255, 255, 0.8) !important;
                        --primary-text-color: black;
                        --secondary-text-color: #333;
                      {% elif state_attr(config.entity, 'hvac_action') == 'heating' %}
                        background-color: rgba(255, 255, 255, 0.8) !important;
                        --primary-text-color: black;
                        --secondary-text-color: #333;
                      {% endif %}
                    }
              - type: custom:mushroom-climate-card
                entity: climate.basement
                name: Basement
                show_temperature_control: true
                card_mod:
                  style: |
                    ha-card {
                      {% if state_attr(config.entity, 'hvac_action') == 'cooling' %}
                        background-color: rgba(255, 255, 255, 0.8) !important;
                        --primary-text-color: black;
                        --secondary-text-color: #333;
                      {% elif state_attr(config.entity, 'hvac_action') == 'heating' %}
                        background-color: rgba(255, 255, 255, 0.8) !important;
                        --primary-text-color: black;
                        --secondary-text-color: #333;
                      {% endif %}
                    }
          # Midea MAP10S1XWT portable unit, via the midea_ac_lan integration. No
          # secondary-line override here: it is a portable sitting in the room it
          # cools, so its built-in sensor is already the right one to show.
          #
          #
          # This card cannot use the shared hvac_action rule: midea_ac_lan does
          # not implement hvac_action at all (climate.py exposes only hvac_mode,
          # target_temperature, current_temperature and preset_mode), so the rule
          # would never fire and the card would stay dark while the unit ran.
          # hvac_mode is derived straight from the device's "power" attribute, so
          # a non-off state is the dependable "it is running" signal.
          #
          # Weaker meaning than every other card here: those go white only while
          # the compressor is engaged, this goes white whenever the unit is on.
          #
          # midealocal's AC attribute set does include compressor_frequency, and
          # climate.py dumps the whole device attribute dict into
          # extra_state_attributes, so a compressor-accurate rule matching the
          # rest of the page is possible IF this unit populates it -- portable
          # units often do not. To check: Developer Tools -> States ->
          # climate.150633093664036_climate, look for compressor_frequency while
          # the unit is cooling. If it is there and non-zero, the condition below
          # becomes: state_attr(config.entity, 'compressor_frequency') | int(0) > 0
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-climate-card
                entity: climate.150633093664036_climate
                name: Server Room
                show_temperature_control: true
                card_mod:
                  style: |
                    ha-card {
                      {% if states(config.entity) not in ['off', 'unavailable', 'unknown'] %}
                        background-color: rgba(255, 255, 255, 0.8) !important;
                        --primary-text-color: black;
                        --secondary-text-color: #333;
                      {% endif %}
                    }
              # Mitsubishi PEAD ducted heat pump in the office, via the
              # dlarrick/hass-kumo HACS integration talking to the unit's WiFi
              # adapter directly on the LAN. No secondary-line override: it is a
              # ducted unit reading its own return air in the space it serves.
              #
              # Unlike the Midea above, this integration does implement
              # hvac_action, so the shared rule below genuinely fires. pykumo
              # reports standby separately from mode, so the card goes white only
              # while the compressor is engaged -- same meaning as the ecobees.
              #
              # The ugly entity id is what the integration generated: the unit's
              # label is empty in kumo_cache.json, so HA fell back to the serial.
              # Renaming the entity to climate.office in the UI is safe; update
              # this card and the temperature card below to match if you do.
              - type: custom:mushroom-climate-card
                entity: climate.kumo_0y34p0085100105f
                name: Office
                show_temperature_control: true
                card_mod:
                  style: |
                    ha-card {
                      {% if state_attr(config.entity, 'hvac_action') == 'cooling' %}
                        background-color: rgba(255, 255, 255, 0.8) !important;
                        --primary-text-color: black;
                        --secondary-text-color: #333;
                      {% elif state_attr(config.entity, 'hvac_action') == 'heating' %}
                        background-color: rgba(255, 255, 255, 0.8) !important;
                        --primary-text-color: black;
                        --secondary-text-color: #333;
                      {% endif %}
                    }

      # ===== TEMPERATURE SECTION =====
      #
      # Named for the room, sourced from whichever sensor is actually in it: the
      # paired remote SmartSensor for the five relocated thermostats, the unit's
      # own sensor for the three that sit with their coils.
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: ''
            subtitle: Temperature
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.smartsensor_temperature
                name: Master Suite
                layout: horizontal
              - type: custom:mushroom-entity-card
                entity: sensor.living_room_temperature
                name: Family Room / Study
                layout: horizontal
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.kids_room_1_temperature
                name: Kids Bed/Bath 1
                layout: horizontal
              - type: custom:mushroom-entity-card
                entity: sensor.kids_2_temperature
                name: Kids Bed/Bath 2
                layout: horizontal
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.clea_room_sensor_temperature
                name: Clea Hall
                layout: horizontal
              - type: custom:mushroom-entity-card
                entity: sensor.main_floor_hvac_current_temperature
                name: Main Floor HVAC
                layout: horizontal
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.bottom_floor_hvac_current_temperature
                name: Bottom Floor HVAC
                layout: horizontal
              - type: custom:mushroom-entity-card
                entity: sensor.basement_current_temperature
                name: Basement
                layout: horizontal
          # The midea_ac_lan config entry currently creates only the climate
          # entity, so there is no sensor.* to point at -- read the temperature
          # off the climate entity's attribute instead. Enabling the extra
          # sensors in the integration's options would give a real sensor entity
          # (and therefore history and statistics); swap this card if that happens.
          #
          # icon_color is set explicitly because mushroom-template-card has no
          # entity to infer a color from -- left unset it renders the neutral
          # grey, which looked wrong next to the seven entity cards above. Those
          # get blue from mushroom's default --rgb-state-entity, so this matches
          # it by name.
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                entity: climate.150633093664036_climate
                icon: mdi:thermometer
                icon_color: blue
                primary: Server Room
                secondary: >-
                  {% set t = state_attr(config.entity, 'current_temperature') %}
                  {{ (t | round(1) ~ ' °F') if t is not none else 'Unavailable' }}
                layout: horizontal
              # Unlike the Server Room card beside it, hass-kumo does create a
              # real sensor entity, so this is a plain entity card like the seven
              # above -- with history and long-term statistics, which the
              # attribute-reading template cards do not get.
              #
              # The entity id is HA's fallback: the unit's label is empty in
              # kumo_cache.json, so it derived one from the config entry title.
              # Renaming it to sensor.office_current_temperature in the UI is
              # safe; just update this line to match.
              - type: custom:mushroom-entity-card
                entity: sensor.lminer_gmail_com_current_temperature
                name: Office
                layout: horizontal

      # ===== HUMIDITY SECTION =====
      #
      # Only the three thermostats that sit with their coils. Ecobee SmartSensors
      # report temperature, occupancy, and battery -- no humidity -- so for the
      # five relocated units there is no humidity reading worth showing.
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: ''
            subtitle: Humidity
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.main_floor_hvac_current_humidity
                name: Main Floor HVAC
                layout: horizontal
              - type: custom:mushroom-entity-card
                entity: sensor.bottom_floor_hvac_current_humidity
                name: Bottom Floor HVAC
                layout: horizontal
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-entity-card
                entity: sensor.basement_current_humidity
                name: Basement
                layout: horizontal
              - type: custom:mushroom-entity-card
                entity: sensor.basement_current_humidity
                name: ' '
                layout: horizontal
                card_mod:
                  style: |
                    ha-card { visibility: hidden; }

      # ===== SPACER =====
      - type: custom:button-card
        color_type: blank-card
        styles:
          card:
            - height: 80px
            - background: none
            - box-shadow: none

      # ===== BOTTOM NAV BAR =====
      - type: custom:mod-card
        card_mod:
          style: |
            @media (max-width: 1023px) {
              ha-card {
                z-index: 1;
                position: fixed;
                bottom: 0px;
                left: 0px;
                width: 100%;
                height: 80px;
                backdrop-filter: blur(120px);
                -webkit-backdrop-filter: blur(150px);
                background: rgba(15, 1, 31, .8);
                opacity: 1;
                border-radius: 0px;
                padding: 0px;
                padding-left: 5px;
                padding-right: 5px;
                border-top: .5px solid rgba(100, 100, 100, 0.2);
                box-shadow: 0px -5px 10px rgba(0, 0, 0, 0.3);
              }
            }
            @media (min-width: 1024px) {
              ha-card {
                z-index: -1;
                position: fixed;
                bottom: 0px;
                left: 0px;
                width: 20%;
                height: 75px;
                background: RGBA(0,0,0,0.50);
                opacity: 1;
                border-radius: 0px;
                padding: 5px;
              }
            }
        card:
          type: grid
          square: false
          columns: 4
          cards:
            - type: custom:button-card
              icon: local:house-regular
              name: Home
              tap_action:
                action: navigate
                navigation_path: /lovelace/home
              styles:
                icon:
                  - color: white
                  - width: 24px
                  - height: 24px
                img_cell:
                  - justify-content: center
                  - height: 100%
                card:
                  - background: none
                  - padding: 7px
                  - opacity: 0.5
                  - width: 74px
                name:
                  - font-size: 10px
                  - align-self: center
                  - font-weight: 300
                  - padding-top: 6px
            - type: custom:button-card
              icon: local:circle-sort-regular
              name: Climate
              tap_action:
                action: navigate
                navigation_path: /home-climate/home
              styles:
                icon:
                  - color: white
                  - width: 24px
                  - height: 24px
                img_cell:
                  - justify-content: center
                  - height: 100%
                card:
                  - background: none
                  - padding: 7px
                  - opacity: 1
                  - width: 74px
                name:
                  - font-size: 10px
                  - align-self: center
                  - font-weight: 400
                  - padding-top: 6px
            - type: custom:button-card
              icon: local:tv-retro-regular
              name: Media
              tap_action:
                action: navigate
                navigation_path: /media-center/home
              styles:
                icon:
                  - color: white
                  - width: 24px
                  - height: 24px
                img_cell:
                  - justify-content: center
                  - height: 100%
                card:
                  - background: none
                  - padding: 7px
                  - opacity: 0.5
                  - width: 74px
                name:
                  - font-size: 10px
                  - align-self: center
                  - font-weight: 300
                  - padding-top: 6px
            - type: custom:button-card
              icon: local:lightbulb-on-regular
              name: Lights
              tap_action:
                action: navigate
                navigation_path: /home-lights/home
              styles:
                icon:
                  - color: white
                  - width: 24px
                  - height: 24px
                img_cell:
                  - justify-content: center
                  - height: 100%
                card:
                  - background: none
                  - padding: 7px
                  - opacity: 0.5
                  - width: 74px
                name:
                  - font-size: 10px
                  - align-self: center
                  - font-weight: 300
                  - padding-top: 6px
