kiosk_mode:
  hide_header: true

title: Lights

# Anchors defined at first use and aliased afterwards: the bottom nav bar, the
# bottom spacer, the top nav styling, and the shared button-card style blocks.
# Without them the six views would repeat ~1000 lines of identical markup.

views:
  # =============================================
  # VIEW 1: Room Grid
  # =============================================
  - title: Lights
    path: home
    icon: mdi:lightbulb-group
    theme: ios-dark-mode-blue-red
    cards:
      # ===== TOP NAV BAR =====
      - type: custom:mod-card
        card_mod: &topnav_mod
          style: |
            ha-card {
              position: static;
              z-index: 3;
              top: 8px;
              left: 8px;
              right: 8px;
              height: 45px;
              padding: 4px 10px;
              border-radius: 10px;
              background-color: rgba(10, 10, 10, .5);
              -webkit-backdrop-filter: blur(100px);
              backdrop-filter: blur(100px);
            }
        card:
          type: grid
          square: false
          columns: 1
          cards:
            - type: custom:mushroom-chips-card
              chips:
                - type: back
                  icon: mdi:arrow-left
                - type: spacer
                - type: template
                  icon: local:lightbulb-on-regular
                  icon_color: '#0171A4'
                  content: Lights
                  card_mod: &chip_mod
                    style: |
                      ha-card {
                        --chip-padding: 4px;
                      }
                - type: spacer
              card_mod: &chips_card_mod
                style: |
                  :host {
                    --chip-background: rgba(0, 0, 0, 0) !important;
                    --mush-card-primary-font-size: 28px;
                  }
                  ha-card {
                    --card-primary-font-size: 30px !important;
                    --card-secondary-font-size: 30px;
                    --chip-icon-size: 15px;
                  }

      # ===== ROOMS SECTION =====
      - type: vertical-stack
        cards:
          # Section Header
          - type: custom:mushroom-template-card
            primary: Rooms
            secondary: ''
            icon: mdi:home-group
            badge_icon: ''
            card_mod:
              style:
                .: |
                  ha-card {
                    background: transparent;
                    --card-primary-font-size: 22px !important;
                    --card-secondary-font-size: 50px !important;
                    --card-primary-line-height: 25px;
                    overflow: visible;
                    top: 10px;
                    right: 10px;
                    padding-bottom: 5px;
                    padding-top: 10px;
                  }
                  ha-state-icon {
                    --icon-symbol-size: 18px;
                  }
                mushroom-shape-icon$: |
                  .shape {
                    padding-right: 0px;
                    padding-left: 0px;
                    padding-bottom: 0px;
                    padding-top: 0px;
                    left: 5px;
                    background: transparent !important;
                  }
                mushroom-state-info$: |
                  .container {
                    --card-secondary-font-size: 18px;
                    --card-primary-font-size: 18px;
                  }

          # Room Tiles — one per HA area that has a light.
          # Row 1: Kitchen | Master Bedroom
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                name: Kitchen
                icon: mdi:silverware-fork-knife
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /home-lights/kitchen
                styles: &room_tile_styles
                  card:
                    - padding: 0px
                    - height: 128px
                    - border-radius: 10px
                  grid:
                    - grid-template-areas: '"i" "n"'
                    - grid-template-columns: 1fr
                    - grid-template-rows: 1fr min-content
                  img_cell:
                    - align-self: center
                    - text-align: center
                  icon:
                    - width: 40px
                    - color: white
                  name:
                    - justify-self: center
                    - font-weight: 600
                    - font-size: 14px
                    - padding-bottom: 15px

              - type: custom:button-card
                name: Master Bedroom
                icon: mdi:bed-king
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /home-lights/master-bedroom
                styles: *room_tile_styles

          # Row 2: Master Bathroom | Master Closet
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                name: Master Bathroom
                icon: mdi:shower
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /home-lights/master-bathroom
                styles: *room_tile_styles

              - type: custom:button-card
                name: Master Closet
                icon: mdi:hanger
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /home-lights/master-closet
                styles: *room_tile_styles

          # Row 3: Basement Game Area | (gap)
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                name: Basement Game Area
                icon: mdi:gamepad-variant
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /home-lights/basement-game-area
                styles: *room_tile_styles

              - type: custom:button-card
                color_type: blank-card

          # Spacer for bottom nav. gap-card is not installed, so this is a
          # blank button-card sized to match the fixed bottom bar.
          - &spacer
            type: custom:button-card
            color_type: blank-card
            styles:
              card:
                - height: 80px
                - background: none
                - box-shadow: none

      # ===== BOTTOM NAV BAR =====
      - &bottom_nav
        type: custom:mod-card
        card_mod:
          style: |
            @media (max-width: 1023px) {
              ha-card {
                z-index: 1;
                position: fixed;
                bottom: 0px;
                left: 0px;
                width: 100%;
                height: 80px;
                backdrop-filter: blur(120px);
                -webkit-backdrop-filter: blur(150px);
                background: rgba(15, 1, 31, .8);
                opacity: 1;
                border-radius: 0px;
                padding: 0px;
                padding-left: 5px;
                padding-right: 5px;
                border-top: .5px solid rgba(100, 100, 100, 0.2);
                box-shadow: 0px -5px 10px rgba(0, 0, 0, 0.3);
              }
            }
            @media (min-width: 1024px) {
              ha-card {
                z-index: -1;
                position: fixed;
                bottom: 0px;
                left: 0px;
                width: 20%;
                height: 75px;
                background: RGBA(0,0,0,0.50);
                opacity: 1;
                border-radius: 0px;
                padding: 5px;
              }
            }
        card:
          type: grid
          square: false
          columns: 4
          cards:
            - type: custom:button-card
              icon: local:house-regular
              name: Home
              tap_action:
                action: navigate
                navigation_path: /lovelace/home
              styles:
                icon:
                  - color: white
                  - width: 24px
                  - height: 24px
                img_cell:
                  - justify-content: center
                  - height: 100%
                card:
                  - background: none
                  - padding: 7px
                  - opacity: 0.5
                  - width: 74px
                name:
                  - font-size: 10px
                  - align-self: center
                  - font-weight: 300
                  - padding-top: 6px
            - type: custom:button-card
              icon: local:circle-sort-regular
              name: Climate
              tap_action:
                action: navigate
                navigation_path: /home-climate/home
              styles:
                icon:
                  - color: white
                  - width: 24px
                  - height: 24px
                img_cell:
                  - justify-content: center
                  - height: 100%
                card:
                  - background: none
                  - padding: 7px
                  - opacity: 0.5
                  - width: 74px
                name:
                  - font-size: 10px
                  - align-self: center
                  - font-weight: 300
                  - padding-top: 6px
            - type: custom:button-card
              icon: local:tv-retro-regular
              name: Media
              tap_action:
                action: navigate
                navigation_path: /media-center/home
              styles:
                icon:
                  - color: white
                  - width: 24px
                  - height: 24px
                img_cell:
                  - justify-content: center
                  - height: 100%
                card:
                  - background: none
                  - padding: 7px
                  - opacity: 0.5
                  - width: 74px
                name:
                  - font-size: 10px
                  - align-self: center
                  - font-weight: 300
                  - padding-top: 6px
            - type: custom:button-card
              icon: local:lightbulb-on-regular
              name: Lights
              tap_action:
                action: navigate
                navigation_path: /home-lights/home
              styles:
                icon:
                  - color: white
                  - width: 24px
                  - height: 24px
                img_cell:
                  - justify-content: center
                  - height: 100%
                card:
                  - background: none
                  - padding: 7px
                  - opacity: 1
                  - width: 74px
                name:
                  - font-size: 10px
                  - align-self: center
                  - font-weight: 400
                  - padding-top: 6px

  # =============================================
  # VIEW 2: Kitchen
  # Caseta DVRF-5NS switches — no dimming, so no sliders.
  # =============================================
  - title: Kitchen
    path: kitchen
    icon: mdi:silverware-fork-knife
    theme: ios-dark-mode-blue-red
    cards:
      # ===== TOP NAV BAR =====
      - type: custom:mod-card
        card_mod: *topnav_mod
        card:
          type: grid
          square: false
          columns: 1
          cards:
            - type: custom:mushroom-chips-card
              chips:
                - type: back
                  icon: mdi:arrow-left
                - type: spacer
                - type: template
                  icon: mdi:silverware-fork-knife
                  icon_color: '#0171A4'
                  content: Kitchen
                  card_mod: *chip_mod
                - type: spacer
              card_mod: *chips_card_mod

      # ===== LIGHTS SECTION =====
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            subtitle: Lights

          # Row 1: Kitchen / Living Wall | Pantry
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: switch.kitchen_living_wall
                name: Kitchen / Living Wall
                icon: mdi:lightbulb
                show_state: false
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                styles: &tile_styles
                  card:
                    - padding: 0px
                    - height: 60px
                  grid:
                    - grid-template-areas: '"i" "n"'
                    - grid-template-columns: 1fr
                    - grid-template-rows: 1fr min-content
                  img_cell:
                    - align-self: center
                    - text-align: center
                  icon:
                    - width: 35px
                    - color: white
                  name:
                    - justify-self: center
                    - font-weight: 600
                    - font-size: 14px
                    - padding-bottom: 8px
                state: &tile_on_state
                  - value: 'on'
                    styles:
                      card:
                        - background-color: 'rgba(255, 255, 255, .8)'
                      icon:
                        - color: '#FF9500'
                      name:
                        - color: black

              - type: custom:button-card
                entity: switch.kitchen_pantry
                name: Pantry
                icon: mdi:cupboard
                show_state: false
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                styles: *tile_styles
                state: *tile_on_state

          # Row 2: Toilet | Bathroom
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: switch.kitchen_kitchen_toilet
                name: Toilet
                icon: mdi:toilet
                show_state: false
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                styles: *tile_styles
                state: *tile_on_state

              - type: custom:button-card
                entity: switch.kitchen_bathroom
                name: Bathroom
                icon: mdi:shower-head
                show_state: false
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                styles: *tile_styles
                state: *tile_on_state

      # ===== BRIDGE SECTION =====
      # Smart Bridge 2 lives in the Kitchen area, so its own controls surface
      # here. They are not kitchen lights, hence the separate section.
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            subtitle: Smart Bridge

          # Row 1: Smart Away | Bedroom Sleep
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: switch.unassigned_smart_away
                name: Smart Away
                icon: mdi:home-export-outline
                show_state: false
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                styles: *tile_styles
                state: *tile_on_state

              - type: custom:button-card
                entity: scene.kitchen_smart_bridge_2_master_bedroom_sleep
                name: Bedroom Sleep
                icon: mdi:sleep
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.kitchen_smart_bridge_2_master_bedroom_sleep
                hold_action:
                  action: more-info
                styles: *tile_styles

          - *spacer

      # ===== BOTTOM NAV BAR =====
      - *bottom_nav

  # =============================================
  # VIEW 3: Master Bedroom
  # Four Caseta dimmers, each with an inline brightness slider.
  # =============================================
  - title: Master Bedroom
    path: master-bedroom
    icon: mdi:bed-king
    theme: ios-dark-mode-blue-red
    cards:
      # ===== TOP NAV BAR =====
      - type: custom:mod-card
        card_mod: *topnav_mod
        card:
          type: grid
          square: false
          columns: 1
          cards:
            - type: custom:mushroom-chips-card
              chips:
                - type: back
                  icon: mdi:arrow-left
                - type: spacer
                - type: template
                  icon: mdi:bed-king
                  icon_color: '#0171A4'
                  content: Master Bedroom
                  card_mod: *chip_mod
                - type: spacer
              card_mod: *chips_card_mod

      # ===== LIGHTS SECTION =====
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            subtitle: Lights

          # Row 1: Main Lights | Accent
          - type: horizontal-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:button-card
                    entity: light.master_bedroom_master_bedroom_main_lights
                    name: Main Lights
                    icon: mdi:ceiling-light
                    show_state: false
                    tap_action:
                      action: toggle
                    hold_action:
                      action: more-info
                    styles: *tile_styles
                    state: *tile_on_state
                  - type: entities
                    card_mod: &slider_mod
                      style: |
                        ha-card {
                          background: rgba(255, 255, 255, .05);
                          border-radius: 10px;
                          box-shadow: none;
                          padding: 0px 8px;
                          margin-top: 4px;
                        }
                    entities:
                      - type: custom:slider-entity-row
                        entity: light.master_bedroom_master_bedroom_main_lights
                        full_row: true

              - type: vertical-stack
                cards:
                  - type: custom:button-card
                    entity: light.master_bedroom_master_bedroom_accent
                    name: Accent
                    icon: mdi:wall-sconce
                    show_state: false
                    tap_action:
                      action: toggle
                    hold_action:
                      action: more-info
                    styles: *tile_styles
                    state: *tile_on_state
                  - type: entities
                    card_mod: *slider_mod
                    entities:
                      - type: custom:slider-entity-row
                        entity: light.master_bedroom_master_bedroom_accent
                        full_row: true

          # Row 2: Left Reading | Right Reading
          - type: horizontal-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:button-card
                    entity: light.master_bedroom_master_bedroom_left_reading
                    name: Left Reading
                    icon: mdi:lamp
                    show_state: false
                    tap_action:
                      action: toggle
                    hold_action:
                      action: more-info
                    styles: *tile_styles
                    state: *tile_on_state
                  - type: entities
                    card_mod: *slider_mod
                    entities:
                      - type: custom:slider-entity-row
                        entity: light.master_bedroom_master_bedroom_left_reading
                        full_row: true

              - type: vertical-stack
                cards:
                  - type: custom:button-card
                    entity: light.master_bedroom_master_bedroom_right_reading
                    name: Right Reading
                    icon: mdi:lamp
                    show_state: false
                    tap_action:
                      action: toggle
                    hold_action:
                      action: more-info
                    styles: *tile_styles
                    state: *tile_on_state
                  - type: entities
                    card_mod: *slider_mod
                    entities:
                      - type: custom:slider-entity-row
                        entity: light.master_bedroom_master_bedroom_right_reading
                        full_row: true

      # ===== SCENES SECTION =====
      # The same three scenes the 4-button Pico fires, so the dashboard and the
      # wall control stay in agreement.
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            subtitle: Master Suite Scenes

          # Row 1: All On | All Low
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: scene.master_suite_all_on
                name: All On
                icon: mdi:white-balance-sunny
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.master_suite_all_on
                  data:
                    transition: 1
                hold_action:
                  action: more-info
                styles: *tile_styles

              - type: custom:button-card
                entity: scene.master_suite_all_low
                name: All Low
                icon: mdi:brightness-4
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.master_suite_all_low
                  data:
                    transition: 1
                hold_action:
                  action: more-info
                styles: *tile_styles

          # Row 2: Reading | (gap)
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: scene.master_suite_reading
                name: Reading
                icon: mdi:book-open-variant
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.master_suite_reading
                  data:
                    transition: 1
                hold_action:
                  action: more-info
                styles: *tile_styles

              - type: custom:button-card
                color_type: blank-card

          - *spacer

      # ===== BOTTOM NAV BAR =====
      - *bottom_nav

  # =============================================
  # VIEW 4: Master Bathroom
  # =============================================
  - title: Master Bathroom
    path: master-bathroom
    icon: mdi:shower
    theme: ios-dark-mode-blue-red
    cards:
      # ===== TOP NAV BAR =====
      - type: custom:mod-card
        card_mod: *topnav_mod
        card:
          type: grid
          square: false
          columns: 1
          cards:
            - type: custom:mushroom-chips-card
              chips:
                - type: back
                  icon: mdi:arrow-left
                - type: spacer
                - type: template
                  icon: mdi:shower
                  icon_color: '#0171A4'
                  content: Master Bathroom
                  card_mod: *chip_mod
                - type: spacer
              card_mod: *chips_card_mod

      # ===== LIGHTS SECTION =====
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            subtitle: Lights

          # Row 1: Toilet | (gap)
          - type: horizontal-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:button-card
                    entity: light.master_bathroom_master_bathroom_toilet
                    name: Toilet
                    icon: mdi:toilet
                    show_state: false
                    tap_action:
                      action: toggle
                    hold_action:
                      action: more-info
                    styles: *tile_styles
                    state: *tile_on_state
                  - type: entities
                    card_mod: *slider_mod
                    entities:
                      - type: custom:slider-entity-row
                        entity: light.master_bathroom_master_bathroom_toilet
                        full_row: true

              - type: custom:button-card
                color_type: blank-card

          - *spacer

      # ===== BOTTOM NAV BAR =====
      - *bottom_nav

  # =============================================
  # VIEW 5: Master Closet
  # DVRF-5NS switches — no dimming, so no sliders.
  # =============================================
  - title: Master Closet
    path: master-closet
    icon: mdi:hanger
    theme: ios-dark-mode-blue-red
    cards:
      # ===== TOP NAV BAR =====
      - type: custom:mod-card
        card_mod: *topnav_mod
        card:
          type: grid
          square: false
          columns: 1
          cards:
            - type: custom:mushroom-chips-card
              chips:
                - type: back
                  icon: mdi:arrow-left
                - type: spacer
                - type: template
                  icon: mdi:hanger
                  icon_color: '#0171A4'
                  content: Master Closet
                  card_mod: *chip_mod
                - type: spacer
              card_mod: *chips_card_mod

      # ===== LIGHTS SECTION =====
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            subtitle: Lights

          # Row 1: Entrance | Main
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: switch.master_closet_master_closet_entrance
                name: Entrance
                icon: mdi:door-open
                show_state: false
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                styles: *tile_styles
                state: *tile_on_state

              - type: custom:button-card
                entity: switch.master_closet_master_closet_main
                name: Main
                icon: mdi:hanger
                show_state: false
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                styles: *tile_styles
                state: *tile_on_state

          - *spacer

      # ===== BOTTOM NAV BAR =====
      - *bottom_nav

  # =============================================
  # VIEW 6: Basement Game Area
  # =============================================
  - title: Basement Game Area
    path: basement-game-area
    icon: mdi:gamepad-variant
    theme: ios-dark-mode-blue-red
    cards:
      # ===== TOP NAV BAR =====
      - type: custom:mod-card
        card_mod: *topnav_mod
        card:
          type: grid
          square: false
          columns: 1
          cards:
            - type: custom:mushroom-chips-card
              chips:
                - type: back
                  icon: mdi:arrow-left
                - type: spacer
                - type: template
                  icon: mdi:gamepad-variant
                  icon_color: '#0171A4'
                  content: Basement Game Area
                  card_mod: *chip_mod
                - type: spacer
              card_mod: *chips_card_mod

      # ===== LIGHTS SECTION =====
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            subtitle: Lights

          # Row 1: Main Lights | (gap)
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: switch.basement_game_area_main_lights
                name: Main Lights
                icon: mdi:ceiling-light
                show_state: false
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                styles: *tile_styles
                state: *tile_on_state

              - type: custom:button-card
                color_type: blank-card

          - *spacer

      # ===== BOTTOM NAV BAR =====
      - *bottom_nav
